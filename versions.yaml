# Every input this repository pins, written once: README.md's "An entry" says what each field means,
# `task versions` what is behind, `task bump NAME=<name>` moves one. It is read by the same
# package it pins for, and held to it by the same gate (versions/gate/repo_test.go).

- name: golangci-lint
  kind: image
  source: golangci/golangci-lint
  version: v2.15.0
  pin: sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481
  track: github-release https://github.com/golangci/golangci-lint
  note: >-
    task lint, with spin's .golangci.yml: spin's version (its versions.yaml's golangci-lint), so
    every repository is measured by the same linters. Bumped with spin, not ahead of it; the
    image's Go must be at least go.mod's.

- name: actionlint
  kind: module
  source: github.com/rhysd/actionlint/cmd/actionlint
  version: v1.7.12
  track: github-release https://github.com/rhysd/actionlint
  note: task lint:workflows, the only thing that reads .github/ before GitHub does. spin's version.

- name: task
  kind: download
  source: https://github.com/go-task/task/releases/download/v{version}/task_linux_amd64.tar.gz
  version: 3.54.0
  pin: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
  track: github-release https://github.com/go-task/task
  note: >-
    the Task the CI workflow runs (go-task/setup-task, from go run ./cmd/versions env task). A
    host brings its own.
