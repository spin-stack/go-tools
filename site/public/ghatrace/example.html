const wall = Math.max(data.wall, 1);
const pct = ms => (100 * ms / wall) + '%';
const wf = document.getElementById('wf');

function fmt(ms) {
  const s = Math.round(ms / 1000);
  if (ms > 0 && ms < 1000) return ms + 'ms';
  if (s >= 3600) return Math.floor(s / 3600) + 'h' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + 'm';
  if (s >= 60) return Math.floor(s / 60) + 'm' + String(s % 60).padStart(2, '0') + 's';
  return s + 's';
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function bar(track, s, kind, extra) {
  const b = el('div', 'b ' + kind + (s.f ? ' fail' : '') + (extra || ''));
  b.style.left = pct(s.s);
  b.style.width = pct(s.e - s.s);
  b.title = s.n + ' · ' + fmt(s.e - s.s) + ' · from ' + fmt(s.s) + ' to ' + fmt(s.e) + (s.t ? '\n' + s.t : '');
  track.appendChild(b);
}



const svgNS = 'http://www.w3.org/2000/svg';
function load(track, lane) {
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'load');
  svg.setAttribute('viewBox', '0 0 ' + wall + ' 100');
  svg.setAttribute('preserveAspectRatio', 'none');
  const title = document.createElementNS(svgNS, 'title');
  title.textContent = lane.job.t || '';
  svg.appendChild(title);
  for (const [cls, y] of [['cpu', p => 100 - 100 * p[2]], ['io', p => 100 - p[3]]]) {
    const line = document.createElementNS(svgNS, 'polyline');
    line.setAttribute('class', cls);
    line.setAttribute('points', lane.load.map(p => p[0] + ',' + y(p) + ' ' + p[1] + ',' + y(p)).join(' '));
    svg.appendChild(line);
  }
  track.appendChild(svg);
}


function row(node, depth, lane) {
  const r = el('div', 'row' + (lane ? ' lane' : '') + (lane && lane.load ? ' loaded' : ''));
  const name = el('div', 'name');
  name.style.paddingLeft = (depth * 14) + 'px';
  const tog = el('span', 'tog', node.c && node.c.length ? '▸' : '');
  name.appendChild(tog);
  if (lane && lane.url) {
    const a = el('a', '', node.n);
    a.href = lane.url;
    name.appendChild(a);
  } else {
    name.appendChild(document.createTextNode(node.n));
  }
  if (lane && lane.critical) name.appendChild(el('span', 'crit-mark', ' ●'));
  if (node.f) name.appendChild(el('span', 'fail-mark', ' ✗'));
  name.title = node.n + (lane ? ' · ' + lane.runner + ' · ' + (lane.labels || []).join(', ') : '') + (node.t ? '\n' + node.t : '');
  r.appendChild(name);
  r.appendChild(el('div', 'dur', fmt(node.e - node.s)));
  const track = el('div', 'track');
  if (lane && lane.queue.e > lane.queue.s) bar(track, lane.queue, 'queue');
  bar(track, node, node.k, lane && lane.critical ? ' crit' : '');
  if (lane && lane.load) load(track, lane);
  r.appendChild(track);
  wf.appendChild(r);
  const kids = [];
  for (const c of node.c || []) kids.push(...row(c, depth + 1));
  for (const k of kids) k.hidden = true;
  r.open = false;
  r.kids = kids;
  r.direct = kids.filter(k => k.depth === depth + 1);
  r.depth = depth;
  tog.onclick = () => toggle(r, !r.open);
  return [r, ...kids];
}

function toggle(r, open) {
  r.open = open;
  r.querySelector('.tog').textContent = r.kids.length ? (open ? '▾' : '▸') : '';
  for (const k of r.direct) {
    k.hidden = !open;
    if (!open && k.open) toggle(k, false);
  }
}

const axis = el('div', 'row axis');
axis.appendChild(el('div', 'name', 'job / step / span'));
axis.appendChild(el('div', 'dur', 'took'));
const at = el('div', 'track');
const steps = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600].map(s => s * 1000);
const step = steps.find(s => wall / s <= 10) || 3600000;
for (let t = 0; t <= wall; t += step) {
  const tk = el('div', 'tick', t % 60000 === 0 && t > 0 ? fmt(t).replace(/m00s$/, 'm').replace(/h00m$/, 'h') : fmt(t));
  tk.style.left = pct(t);
  at.appendChild(tk);
}
axis.appendChild(at);
wf.appendChild(axis);

const lanes = data.lanes.map(l => row(l.job, 0, l)[0]);
document.getElementById('expand').onclick = () => {
  const all = [...wf.querySelectorAll('.row')].filter(r => r.kids);
  for (const r of all) toggle(r, true);
};
document.getElementById('collapse').onclick = () => lanes.forEach(r => toggle(r, false));


if (location.hash === '#open') document.getElementById('expand').click();
</script>
