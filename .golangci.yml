# spin's golangci-lint configuration (spin-stack/spin's .golangci.yml), so this repository's Go is
# measured as spin's is: the same linters on and off, the same thresholds, the same exclusions of
# what spin judged pedantic. Run by `task lint`, at the version versions.yaml pins (golangci-lint),
# which is spin's.
#
# What is not copied is spin's own: forbidigo's patterns are its invariants (UUIDv7 ids, its log
# package, its metric catalogue), none of which has a counterpart here, and without them the
# linter's defaults forbid fmt.Print - how a command answers on stdout; and the exclusions by path
# name spin's trees and the debt counted in them. A change to spin's file is brought here by hand,
# the same day.
version: "2"
run:
  concurrency: 8
  allow-parallel-runners: true
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - decorder
    - dogsled
    - durationcheck
    - errchkjson
    - exptostd
    - ginkgolinter
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - goheader
    - goprintffuncname
    - gosmopolitan
    - grouper
    - iface
    - importas
    - intrange
    - loggercheck
    - makezero
    - mirror
    - nilnesserr
    - nosprintfhostport
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testableexamples
    - testifylint
    - unconvert
    - usetesting
    - wastedassign
    - zerologlint
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - dupl
    - dupword
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - gosec
    - inamedparam
    - interfacebloat
    - ireturn
    - lll
    - misspell
    - mnd
    - musttag
    - nakedret
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nonamedreturns
    - paralleltest
    - predeclared
    - promlinter
    - protogetter
    - spancheck
    - tagalign
    - tagliatelle
    - thelper
    - tparallel
    - unparam
    - usestdlibvars
    - varnamelen
    - whitespace
  disable:
    - err113
    - sloglint
    - wsl
    - exhaustruct
    - testpackage
    - wrapcheck
    # CLI-specific exclusions - these are too pedantic for command-line tools
    - gochecknoglobals  # Cobra commands require package-level vars
    - gochecknoinits    # Cobra flag setup uses init()
    - nlreturn          # Excessive whitespace requirements
    - varnamelen        # Short names like 'c' for cobra.Command are idiomatic
    - mnd               # Magic numbers in CLI flags are fine
    - paralleltest      # Not all tests benefit from parallelization
    - tagliatelle       # snake_case in YAML config is conventional
    - funlen            # Command handlers are naturally longer
    - lll               # Long lines in help text are acceptable
    - godot             # Comment punctuation is pedantic
    - ireturn           # Returning interfaces is fine for formatters
    - gomoddirectives   # go.mod directives are intentional
    - protogetter       # Direct proto field access is fine for CLI output
    - exhaustive        # Not all switch statements need all cases
    # Additional pragmatic exclusions for runtime code
    - errchkjson        # JSON marshal errors in tests are fine
    - inamedparam       # Named parameters in interfaces are pedantic
    - nilnil            # Returning nil,nil is acceptable in some cases
    - nolintlint        # Nolint directives are intentional
    - predeclared       # Some predeclared names are fine in specific contexts
    - whitespace        # Trailing whitespace is cosmetic
    - unparam           # Unused params may be needed for interface compliance
    - revive            # Often overlaps with other linters
    - noctx             # Context not always needed for exec.Command
  settings:
    cyclop:
      max-complexity: 20
    dupl:
      threshold: 250
    goconst:
      # Test files legitimately repeat literals (fixtures, expected values);
      # extracting constants there adds noise without value.
      ignore-tests: true
      # Generic short strings (name, data, count, ...) appear in unrelated
      # contexts; only flag literals repeated 4+ times to avoid false churn.
      min-occurrences: 4
    gocognit:
      min-complexity: 120
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
    sloglint:
      context: all
    staticcheck:
      checks:
        - all
        - "-ST1005"  # Allow capitalized error strings
    usetesting:
      # A test's context is t.Context(): it ends with the test, so what the test started ends
      # with it, and a helper's goroutine cannot outlive the test that leaked it. The exception
      # is code that runs after that context is cancelled, which is every t.Cleanup: there it is
      # context.WithoutCancel(t.Context()), the test's context without its cancellation.
      context-background: true
      context-todo: true
  exclusions:
    generated: lax
    paths:
      - ^_output/
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters:
          - ineffassign
        text: ineffectual assignment to ctx
      - linters:
          - staticcheck
        text: this value of `ctx` is never used
      - linters:
          - wastedassign
        text: assigned to ctx, but never used afterwards
      # Errcheck exclusions for cleanup operations
      - linters:
          - errcheck
        text: "Error return value of.*Close"
      - linters:
          - errcheck
        text: "Error return value of.*Remove"
      - linters:
          - errcheck
        text: "Error return value of.*Sync"
      - linters:
          - errcheck
        text: "Error return value of.*Wait"
      - linters:
          - errcheck
        text: "Error return value of.*Set"
      - linters:
          - errcheck
        text: "Error return value of.*io.Copy"
      - linters:
          - errcheck
        path: _test\.go$
      - linters:
          - gosec
        text: G104  # Unhandled errors covered by errcheck exclusions
      - linters:
          - gosec
        text: G115  # Integer overflow conversion is acceptable for CLI flags
      - linters:
          - gosec
        text: G301  # Directory permissions 0755 are standard for system directories
      - linters:
          - gosec
        text: G306  # File permissions 0644 are standard for config files
      - linters:
          - gosec
        text: G204  # Subprocess with variable is intentional
      - linters:
          - gosec
        text: G304  # File inclusion via variable is intentional for CLI
      - linters:
          - gosec
        text: G703  # Path traversal via taint analysis; paths are intentional (same as G304)
      - linters:
          - gosec
        path: _test\.go$
        text: G602  # Slice index in tests is guarded by preceding length checks
      # Test style preferences
      - linters:
          - testifylint
        text: "for error assertions use require"
      - linters:
          - thelper
        path: _test\.go$
      # Style preferences that are too pedantic
      - linters:
          - godox
        text: "TODO"
      - linters:
          - nonamedreturns
        text: "named return"
      - linters:
          - inamedparam
        text: "parameter name"
      - linters:
          - unparam
        text: "is unused"
      # Package comments (can be added incrementally)
      - linters:
          - staticcheck
        text: "ST1000"
      # Nil checks are fine
      - linters:
          - staticcheck
        text: "S1009"
      # ALL_CAPS for syscall constants is acceptable
      - linters:
          - staticcheck
        text: "ST1003.*ALL_CAPS"
      # Type inference suggestions are pedantic
      - linters:
          - staticcheck
        text: "QF1011"
      # Errorlint %v in tests is acceptable
      - linters:
          - errorlint
        path: _test\.go$
      # Named returns can be useful for readability
      - linters:
          - nakedret
        text: "naked return"
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - ^_output/
      - third_party$
      - builtin$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
