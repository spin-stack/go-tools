# The gate on every change: `task lint` and `task test`, the targets a developer runs, and not a
# list of steps here that goes out of step with them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the tip of a branch is worth a verdict. Never on main: a cancelled run there is a commit
# nobody proved.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  gate:
    # The check main's ruleset requires, named Gate in every spin-stack repository.
    name: Gate
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # A ceiling, not a budget: a `go test` that deadlocks would otherwise hold the runner for six
    # hours without printing a failure.
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1.8.1
        with:
          # task mutate diffs against the branch point, which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Task is pinned in versions.yaml like every other input: TASK_VERSION and TASK_SHA256.
      - name: Task's pin
        run: go run ./cmd/versions env task >> "$GITHUB_ENV"

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      # always(): a failed suite is when the per-function numbers are wanted.
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "coverage.out was not produced; the tests may have failed before coverage ran." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Go coverage"
            echo
            echo "**$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')** total"
            echo
            echo '<details><summary>Function detail</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload Go coverage HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go
          path: coverage.html
          retention-days: 7
          if-no-files-found: ignore

      # The tests are green; this asks what they would have refused. On a pull request the diff is
      # against what it merges into, on a push against what was there before.
      - name: What this change broke, and whether a test noticed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="$BEFORE"
          fi
          git rev-parse --verify "$base^{commit}" >/dev/null 2>&1 || base=HEAD~1
          task mutate BASE="$base"
