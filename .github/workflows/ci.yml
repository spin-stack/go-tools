# The gate on every change: `task lint` and `task test`, the targets a developer runs, and not a
# list of steps here that goes out of step with them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the tip of a branch is worth a verdict. Never on main: a cancelled run there is a commit
# nobody proved.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A ceiling, not a budget: a `go test` that deadlocks would otherwise hold the runner for six
    # hours without printing a failure.
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Task is pinned in versions.yaml like every other input: TASK_VERSION and TASK_SHA256.
      - name: Task's pin
        run: go run ./cmd/versions env task >> "$GITHUB_ENV"

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      # always(): a failed suite is when the per-function numbers are wanted.
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "coverage.out was not produced; the tests may have failed before coverage ran." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Go coverage"
            echo
            echo "**$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')** total"
            echo
            echo '<details><summary>Function detail</summary>'
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload Go coverage HTML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go
          path: coverage.html
          retention-days: 7
          if-no-files-found: ignore
