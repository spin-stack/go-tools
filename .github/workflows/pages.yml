name: Pages

# Builds the documentation site (site/) on every change to it, with `task site` as a developer
# does, and publishes main to GitHub Pages. The mutate page's example is a test's testdata, so a
# change there rebuilds it too, and the firewall's pins change how it installs.

on:
  push:
    branches: [main]
    paths: ['site/**', 'cmd/mutate/testdata/example/**', 'cmd/sfw/**', 'internal/sfw/**', 'Taskfile.yml', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'cmd/mutate/testdata/example/**', 'cmd/sfw/**', 'internal/sfw/**', 'Taskfile.yml', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, so each page's "Last updated" is its own last change, not the checkout's.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Task is pinned in versions.yaml like every other input: TASK_VERSION and TASK_SHA256.
      - name: Task's pin
        run: go run ./cmd/versions env task >> "$GITHUB_ENV"
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          checksum: ${{ env.TASK_SHA256 }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      # No store cache: a package restored from one is never asked of the registry, so the
      # firewall, which stands between the two, would not see it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # What a developer runs: the install through Socket Firewall, then the build.
      - run: task site
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
