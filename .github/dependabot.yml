# Every change to this file - a comment's too - starts a run of every ecosystem below, whatever
# the schedule says: change it rarely. Each runs Monday morning, a week after a release
# (cooldown), and rebase-strategy is disabled so a pull request is not remade each time main
# moves: main's ruleset merges a branch only up to date with it, and "Update branch" or
# `@dependabot rebase` brings one up when it is merged.
#
# Dependabot moves what Go writes of its modules (go.sum) and the actions the workflows run.
# Everything else is versions.yaml's, moved by task bump.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    rebase-strategy: disabled
    # A release a week old has had a week for anybody to find it was not what it said.
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: go

  # The workflows' `uses:`, each pinned by commit with its version in a comment for this to move.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
