# The tasks every spin-stack repository has, written once: the same names, the same arguments and
# the same meaning in each. It ships in go-tools' release beside the commands it calls, and
# go-tools' `task` (cmd/task) names the unpacked copy in GO_TOOLS_TASKS, so a repository's Taskfile
# takes it in one include and commits no copy:
#
#   includes:
#     common:
#       taskfile: '{{.GO_TOOLS_TASKS}}'
#       flatten: true
#
# flatten: the tasks keep these names, `task versions` and not `task common:versions`, and a
# repository that defines one of them itself is refused by Task ("Found multiple tasks"), so a
# name here has one meaning everywhere. What differs between repositories is the include's vars,
# and nothing else:
#
#   RELEASE         how the repository is released, a map: `release` below says what it holds and
#                   why it is one.
#   VERSIONS_FILES  every file of pins the repository has, when versions.yaml is not the only one.
#   WORKFLOWS_ALSO  a second .github directory the repository holds - an example it publishes.
#   CONSUMERS       where the consumers table is, when it is not consumers.toml.
#   GO_TOOLS        go-tools' own: `go run ./cmd/`, so that it runs its tree's commands and not
#                   its last release's. Everywhere else the commands are on PATH.
#
# Vars of the include, not the Taskfile's own: Task gives a Taskfile's var of the same name
# precedence over the command line's in an included task, so a root `VERSION` - spin has one -
# would answer for `task bump VERSION=...`. Hence TO, RELEASE_DRY and not DRY, and no name here a
# repository is likely to hold already. For the same reason bump cannot refuse a `VERSION=` given
# to it: in an included task that name reads the same whether the command line set it or the
# repository's Taskfile did, so a refusal would be spin's every bump.
version: '3'

tasks:

  versions:
    desc: Say which pins of versions.yaml (and of every file in VERSIONS_FILES) are behind their upstream. It fails when any is, and when an entry could not be read, which may be behind; the last line of a file's rows says which. Through Task either is exit 201.
    cmds:
      # Every file, whichever is behind. The status is the worst any file had: 2, an entry that
      # could not be read, is not hidden by a later file's 1 or 0.
      #
      # The token is a person's, as release's is: GitHub answers sixty requests an hour without
      # one, and a private repository none - an entry check then cannot read. A workflow sets
      # GITHUB_TOKEN or GH_TOKEN and the line does nothing; a person has gh logged in, and the
      # token is gh's. With neither - no gh, or not logged in - the task goes on without, and
      # says of each entry it could not read that it could not.
      - |
        if [ -z "${GITHUB_TOKEN:-}${GH_TOKEN:-}" ] && token="$(gh auth token 2>/dev/null)"; then export GH_TOKEN="$token"; fi
        status=0
        for file in {{.VERSIONS_FILES | default "versions.yaml"}}; do
          {{.GO_TOOLS}}versions check -task -file "$file" || { s=$?; [ "$s" -le "$status" ] || status=$s; }
        done
        exit $status

  bump:
    desc: Pin one entry of versions.yaml at a version, the newest by default, and never at an older one than it is at unless BACK=1 says so (task bump NAME=golangci-lint [TO=v2.14.0] [FILE=another/versions.yaml] [BACK=1]).
    requires:
      vars: [NAME]
    cmds:
      # A bump reads the upstreams check reads, with the token check has.
      - |
        if [ -z "${GITHUB_TOKEN:-}${GH_TOKEN:-}" ] && token="$(gh auth token 2>/dev/null)"; then export GH_TOKEN="$token"; fi
        {{.GO_TOOLS}}versions bump -file {{.FILE | default "versions.yaml"}} {{if .BACK}}-back {{end}}{{.NAME}} {{.TO}}

  release:
    desc: Release main's head (or SHA) as the next v<YYYYMMDD>.<NN> of today, in UTC, with RELEASE's files - in a repository whose include states RELEASE's proof and jobs, and refused in every other. A person runs it, with gh logged in, or a workflow with GH_TOKEN; it refuses a commit the jobs of the proof workflow have not passed on, and one released already. RELEASE_DRY=1 refuses what a release would and prints the name, and releases nothing.
    # RELEASE is a map, of the include's vars:
    #
    #   vars:
    #     RELEASE:
    #       map: {proof: ci.yml, jobs: Gate, files: _output/*.tar.gz}
    #
    #   proof      the workflow whose pass proves a commit can be released.
    #   jobs       the jobs that pass must have run, by the start of their name and comma-separated.
    #   files      what the release carries besides its tag: files, or globs of them.
    #   elsewhere  the repository releases, but not with this task: the file under
    #              .github/workflows that does, as release.yml. A release built from its tag - by
    #              GoReleaser, an image, a signature - is one this task cannot cut.
    #   none       the repository does not release, and why in a sentence.
    #
    # The task refuses with `elsewhere` or `none`, whatever else the map holds. They are keys of
    # the Taskfile and not a comment in it so that a gate can read them: a repository with a
    # release workflow that has not said `elsewhere` is one a check can find.
    #
    # A map because the command line and the environment hold strings and nothing else. Under Task
    # 3.54.0 a var of the command line or the environment reaches an included task wherever the
    # include states none of that name, so two plain vars would be two words away from a release: in a
    # repository that releases by its own workflow and has a ci.yml with a Gate job, `task release`
    # with those two words would publish an empty release marked latest. No string is a map, and where
    # the include states one it wins over both. So a repository that states nothing, `elsewhere`
    # or `none` is one this task cannot be made to release. The vars below are the task's own, which Task
    # reads after every other: none of them is the command line's either.
    vars:
      RELEASE_STATED: '{{kindIs "map" .RELEASE}}'
      RELEASE_ELSEWHERE: '{{if kindIs "map" .RELEASE}}{{.RELEASE.elsewhere}}{{end}}'
      RELEASE_NONE: '{{if kindIs "map" .RELEASE}}{{.RELEASE.none}}{{end}}'
      RELEASE_PROOF: '{{if kindIs "map" .RELEASE}}{{.RELEASE.proof}}{{end}}'
      RELEASE_JOBS: '{{if kindIs "map" .RELEASE}}{{.RELEASE.jobs}}{{end}}'
      RELEASE_FILES: '{{if kindIs "map" .RELEASE}}{{.RELEASE.files}}{{end}}'
    preconditions:
      - sh: '{{.RELEASE_STATED}}'
        msg: "release: this repository's include of the common tasks states no RELEASE, so nothing says how it is released and this task releases nothing. RELEASE is a map of the include's vars, written in the Taskfile - `map: {proof: <workflow>, jobs: <jobs>}` where this task cuts the releases, `map: {elsewhere: <the workflow that does>}` where the repository releases but not with this task, `map: {none: <why>}` where it does not release - and a value on the command line or in the environment is not one."
      - sh: '{{if .RELEASE_ELSEWHERE}}false{{else}}true{{end}}'
        msg: "release: this repository releases, but not with this task: {{.RELEASE_ELSEWHERE}} does. Its Taskfile says so (RELEASE's elsewhere), and this task releases nothing here."
      - sh: '{{if .RELEASE_NONE}}false{{else}}true{{end}}'
        msg: "release: this repository does not release. Its Taskfile says why (RELEASE's none): {{.RELEASE_NONE}}"
      - sh: '{{if and .RELEASE_PROOF .RELEASE_JOBS}}true{{else}}false{{end}}'
        msg: "release: this repository's RELEASE names no proof and jobs, the workflow whose pass proves a commit and the jobs that pass must have run: without both nothing is proven, and nothing released."
    cmds:
      # The name is counted from every tag there is, and main's head is origin's as it is now.
      - git fetch --quiet --tags origin main
      # proven: the proof passed on this commit, or on a pull request's with the same tree, which
      # is what a rebase merge leaves main with. The release makes the tag, last, so one that
      # failed to publish is no tag naming a commit with no files. --latest: a repository
      # publishes other things as releases too (brand its screens, with --latest=false), and
      # `track: github-release` reads the one GitHub calls latest.
      - |
        set -eu
        [ -n "${GH_TOKEN:-}" ] || export GH_TOKEN="$(gh auth token)"
        sha="$(git rev-parse --verify '{{.SHA | default "origin/main"}}^{commit}')"
        repo="${GITHUB_REPOSITORY:-}"
        [ -n "$repo" ] || repo="$(gh repo view --json nameWithOwner --jq .nameWithOwner)"
        {{.GO_TOOLS}}proven release -repo "$repo" -sha "$sha" -workflow '{{.RELEASE_PROOF}}' -events push,pull_request -ran '{{.RELEASE_JOBS}}' -also ''
        name="$({{.GO_TOOLS}}release "$sha")"
        # Every refusal above has been made, and gh's own for a file that is not there: what is
        # left is the release. Its files are listed, so a glob that matches nothing is seen.
        if [ -n '{{.RELEASE_DRY}}' ]; then
          {{with .RELEASE_FILES}}ls -d -- {{.}}; {{end}}echo "RELEASE_DRY: $sha would be released to $repo as $name, and is not"; exit 0
        fi
        gh release create "$name" {{.RELEASE_FILES}} --repo "$repo" --target "$sha" --title "$name" --latest --generate-notes

  lint:workflows:
    desc: actionlint over .github/ (and WORKFLOWS_ALSO), at the version versions.yaml pins, and every action pinned by its commit.
    cmds:
      # -shellcheck= because actionlint runs whatever shellcheck is on PATH: a runner has one and
      # a laptop may not, and a gate whose answer depends on the machine is not a gate.
      - go run github.com/rhysd/actionlint/cmd/actionlint@$({{.GO_TOOLS}}versions version actionlint) -shellcheck= {{if .WORKFLOWS_ALSO}}.github/workflows/*.yml {{.WORKFLOWS_ALSO}}/workflows/*.yml{{end}}
      # A tag is whatever its owner points it at; the comment is the version Dependabot moves.
      - |
        if grep -rnE '^\s*(- )?uses: [^./][^ ]*@' .github {{.WORKFLOWS_ALSO}} | grep -vE '@[0-9a-f]{40} # v[0-9]'; then
          echo "an action above is used by a tag its owner can move: pin it by commit SHA, with '# vX.Y.Z' after it"
          exit 1
        fi

  consumers:
    desc: Say which commit of this repository each consumer in consumers.toml is on - its pin, the release that names it, how far behind main, whether its copies and its npm packages are this repository's at that commit - read through gh, or `-- -checkout owner/name=dir[@ref]`. A report, exit 0 whatever it finds.
    preconditions:
      - sh: test -f '{{.CONSUMERS | default "consumers.toml"}}'
        msg: 'no {{.CONSUMERS | default "consumers.toml"}}: this repository names nobody that copies from it'
    cmds:
      # A consumer is behind origin/main as it is now, and on the releases there are now.
      - git fetch --quiet --tags origin main
      - '{{.GO_TOOLS}}consumers -table {{.CONSUMERS | default "consumers.toml"}} {{.CLI_ARGS}}'
